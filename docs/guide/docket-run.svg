<svg viewBox="0 0 760 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The jobs of one docket run, grouped by family" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#1c1a17">
