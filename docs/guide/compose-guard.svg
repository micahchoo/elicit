<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the compose-freely, guard-mechanically shape" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#1c1a17">
<rect width="100%" height="100%" fill="#faf7f2"/>
<defs><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1a17"/></marker></defs>

<rect x="30" y="90" width="190" height="70" rx="8" fill="#fff" stroke="#1c1a17" stroke-width="1.5"/>
<text x="125" y="119" text-anchor="middle">the model composes</text>
<text x="125" y="139" text-anchor="middle" font-size="12" fill="#6b6459">freely &#8212; any creativity</text>
<line x1="220" y1="125" x2="264" y2="125" stroke="#1c1a17" stroke-width="1.5" marker-end="url(#ar2)"/>

<rect x="270" y="40" width="240" height="170" rx="8" fill="#fff" stroke="#8a3324" stroke-width="2"/>
<text x="390" y="66" text-anchor="middle" fill="#8a3324" font-weight="600">THE GUARD</text>
<text x="390" y="84" text-anchor="middle" font-size="11" fill="#6b6459">plain string checks &#8212; no model</text>
<text x="286" y="110" font-size="12">&#183; your exact words, verbatim</text>
<text x="286" y="130" font-size="12">&#183; actually a question</text>
<text x="286" y="150" font-size="12">&#183; adds something new</text>
<text x="286" y="170" font-size="12">&#183; quotes visibly set off</text>
<text x="286" y="190" font-size="12">&#183; no agent &#8220;I&#8221; outside quotes</text>

<line x1="510" y1="125" x2="554" y2="125" stroke="#1c1a17" stroke-width="1.5" marker-end="url(#ar2)"/>
<text x="516" y="117" font-size="11" fill="#6b6459">pass</text>
<rect x="560" y="95" width="170" height="60" rx="8" fill="#f4e4de" stroke="#8a3324" stroke-width="1.5"/>
<text x="645" y="120" text-anchor="middle">the question</text>
<text x="645" y="138" text-anchor="middle">reaches you</text>

<line x1="390" y1="210" x2="390" y2="242" stroke="#1c1a17" stroke-width="1.5" marker-end="url(#ar2)"/>
<text x="398" y="230" font-size="11" fill="#6b6459">fail</text>
<rect x="270" y="248" width="240" height="44" rx="8" fill="none" stroke="#6b6459" stroke-dasharray="5 4"/>
<text x="390" y="274" text-anchor="middle" font-size="12" fill="#6b6459">one retry &#8212; then fall through</text>
</svg>
